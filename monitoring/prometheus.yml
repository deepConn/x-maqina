global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'x-maqina'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  # x-maqina FastAPI application
  - job_name: 'x-maqina-api'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['app:8000']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL (if postgres_exporter is added)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'pg_.*'
        action: 'keep'

  # Redis (if redis_exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'redis_.*'
        action: 'keep'
